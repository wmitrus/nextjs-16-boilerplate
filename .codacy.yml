---
# Codacy configuration file.
#
# Controls path exclusions for each engine. Note: enabling/disabling tools
# is done in the Codacy UI (Code patterns page) — not here.
#
# Docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# SQL rules live in the repository root: `.sqlfluff` (dialect: postgres) holds
# the linting policy, `.sqlfluffignore` the path exclusions. The sqlfluff
# exclusion below repeats that ignore on purpose — the two files serve
# different consumers, not the same one twice:
#
#   `.sqlfluffignore` — local SQLFluff runs, the IDE, CI. Natively supported;
#                       SQLFluff even has `--disregard-sqlfluffignores` for
#                       deliberately overriding it.
#   `.codacy.yml`     — Codacy. Its docs confirm it reads `.sqlfluff`, but say
#                       nothing about `.sqlfluffignore`, so relying on the
#                       wrapper to pass ignore semantics through would be an
#                       assumption, not a policy.

engines:
  # ── Lizard — cyclomatic complexity ──────────────────────────────────────────
  # Tool enable state is set in Codacy UI. Exclusions below are always applied.
  lizard:
    exclude_paths:
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.integration.test.ts'
      - '**/*.spec.ts'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'
      - 'e2e/**'
      - 'scripts/**'
      - '.next/**'
      - 'node_modules/**'

  # ── ESLint — TypeScript static analysis ─────────────────────────────────────
  # Codacy reads this project's eslint.config.mjs and applies it.
  eslint:
    exclude_paths:
      - '.vscode/**'
      - '.next/**'
      - 'node_modules/**'
      - 'coverage/**'
      - 'storybook-static/**'
      - 'tests/**'
      - 'e2e/**'
      - 'scripts/**'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'

  # ── Opengrep — semantic code patterns and secret scanning ───────────────────
  # Successor to Semgrep; the engine key renamed with it, and a stale `semgrep`
  # key matches no engine, so its exclusions silently stop applying.
  #
  # Only generated, vendored and build output is excluded here. Tests, e2e
  # specs and scripts are deliberately NOT excluded: Opengrep is also a
  # security and secret scanner, and a committed credential is a committed
  # credential wherever it lives — test fixtures and CI scripts are exactly
  # where real ones tend to be left behind. Findings on deliberate fixtures are
  # handled one by one in the Codacy UI, not by making the scanner blind to
  # whole directories.
  #
  # Uses Codacy's default Opengrep patterns; there is no `.semgrep.yaml` in
  # this repository and adding one would fork the rule set away from what
  # Codacy maintains.
  opengrep:
    exclude_paths:
      - '.next/**'
      - 'node_modules/**'
      - 'coverage/**'
      - 'storybook-static/**'
      - 'dist/**'
      - 'src/core/db/migrations/generated/**'

  # ── SQLFluff — SQL linting ──────────────────────────────────────────────────
  # Policy and dialect live in `.sqlfluff`; this repeats `.sqlfluffignore`'s
  # path exclusion so Codacy's behaviour is stated rather than assumed (see the
  # header comment). Drizzle writes these files — style advice on generated
  # output has no addressee.
  sqlfluff:
    exclude_paths:
      - 'src/core/db/migrations/generated/**'

  # ── Trivy — dependency vulnerability scanning ───────────────────────────────
  trivy:
    exclude_paths:
      - '.next/**'

  # ── Checkov — IaC security scanning ─────────────────────────────────────────
  checkov:
    exclude_paths:
      - '.next/**'
      - 'node_modules/**'

# ── Global exclusions applied to all engines ────────────────────────────────
exclude_paths:
  - '.vscode/**'
  - '.next/**'
  - 'node_modules/**'
  - 'coverage/**'
  - 'storybook-static/**'
  - '.vercel/**'
  - 'dist/**'
  - 'exports/**'
  - 'logs/**'
  - 'data/**'
