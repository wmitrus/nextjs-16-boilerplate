name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    name: Prevent PR from main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        if: github.head_ref == 'main'
        run: |
          echo "Error: Pull requests from the 'main' branch are not allowed."
          exit 1

  validate:
    name: Quality Checks
    needs: check-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Environment Consistency
        run: pnpm env:check

      - name: AI Instruction Architecture
        run: pnpm ai:instructions:check

      # env:validate is intentionally NOT run here.
      # It is a deployment-configuration gate, not a code-quality gate.
      # It requires deployment secrets (CLERK_SECRET_KEY, DEFAULT_TENANT_ID, etc.)
      # that are unavailable in PR context — particularly for forked PRs.
      # Cross-field env validation runs in preview-deploy.yml and prod-deploy.yml
      # after `vercel pull` has downloaded the actual deployment environment.

      - name: Circular Dependency Check (Skott)
        run: pnpm skott:check:only

      - name: Circular Dependency Check (Madge)
        run: pnpm madge

      - name: Unused Dependency Check
        run: pnpm depcheck
