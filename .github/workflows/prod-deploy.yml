name: Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_PREBUILT_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy-production:
    name: Vercel Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      # See preview-deploy.yml's identical step for why this is cached and
      # keyed this way.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Pull Vercel Environment Information
        run: ./node_modules/.bin/vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Environment
        run: pnpm env:check
        env:
          APP_ENV: production

      - name: Validate Environment Cross-Field Requirements
        run: pnpm env:validate
        env:
          APP_ENV: production
          NODE_ENV: production

      - name: Validate Deployment Profiles
        run: pnpm vercel:deploy:validate

      - name: Build Project Artifacts
        id: build_context
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a

          if [ "${AUTH_PROVIDER:-}" = "authjs" ] && [ -z "${NEXTAUTH_URL:-}" ]; then
            echo "AUTH_PROVIDER=authjs requires NEXTAUTH_URL in Vercel Production env. Do not mask a missing runtime env with a build-only fallback."
            exit 1
          fi

          if [ -z "${VERCEL_URL:-}" ]; then
            unset VERCEL_URL
          fi

          if [ -n "${NEXT_DEPLOYMENT_ID:-}" ]; then
            echo "NEXT_DEPLOYMENT_ID is reserved for Vercel-managed Next.js runtime identity and must not be set for a prebuilt build."
            exit 1
          fi

          export VERCEL_PREBUILT_DEPLOYMENT_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "production_url=$NEXT_PUBLIC_APP_URL" >> "$GITHUB_OUTPUT"
          ./node_modules/.bin/vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          APP_ENV: production
          NEXT_PUBLIC_APP_ENV: production

      # Durable order: Vercel-owned migrations -> tenant readiness -> artifact upload.
      # Guarded by validate-vercel-deploy-profiles.ts; do not move this check.
      - name: Validate Production Tenant Readiness
        run: pnpm tenant:readiness:vercel:prod

      - name: Validate Prebuilt Artifact Contract
        run: pnpm vercel:prebuilt:validate

      - name: Activate Production Prebuilt Upload Profile
        run: cp .vercelignore.prebuilt .vercelignore

      - name: Validate Prebuilt Upload Coverage
        shell: bash
        run: |
          ./node_modules/.bin/vercel deploy --prebuilt --prod --dry --json --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-prebuilt-dry-run.json
          pnpm vercel:prebuilt:validate -- --dry-run-json /tmp/vercel-prebuilt-dry-run.json

      - name: Deploy to Vercel
        id: vercel_deploy
        shell: bash
        run: |
          set +e
          ./node_modules/.bin/vercel deploy --prebuilt --prod --skip-domain --yes --json --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubDeployment=1 \
            --meta githubCommitOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubCommitRepo="$GITHUB_REPOSITORY_NAME" \
            --meta githubRepo="$GITHUB_REPOSITORY_NAME" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA" \
            > /tmp/vercel-production-deploy.json
          DEPLOY_EXIT=$?
          set -e
          cat /tmp/vercel-production-deploy.json
          if [ $DEPLOY_EXIT -ne 0 ]; then
            exit $DEPLOY_EXIT
          fi
          DEPLOY_URL=$(node -e 'const fs=require("node:fs"); const result=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const raw=result.deployment?.url ?? result.url; if (typeof raw !== "string" || raw.length === 0) throw new Error("Vercel deploy JSON does not contain a URL."); const url=new URL(raw.startsWith("http") ? raw : `https://${raw}`); if (url.protocol !== "https:") throw new Error("Vercel deploy URL must use HTTPS."); process.stdout.write(url.href.replace(/\/$/, ""));' /tmp/vercel-production-deploy.json)
          echo "production_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Verify Production Deployment Readiness
        shell: bash
        run: |
          ./node_modules/.bin/vercel inspect "${{ steps.vercel_deploy.outputs.production_url }}" --wait --json --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-production-inspect.json
          node - <<'NODE'
          const fs = require('node:fs');

          const deployment = JSON.parse(
            fs.readFileSync('/tmp/vercel-production-inspect.json', 'utf8'),
          );
          const expected = {
            readyState: 'READY',
            target: 'production',
          };
          const actual = {
            readyState: deployment.readyState,
            target: deployment.target,
          };

          if (
            actual.readyState !== expected.readyState ||
            actual.target !== expected.target
          ) {
            console.error(
              JSON.stringify(
                {
                  message:
                    'Vercel deployment did not reach the expected ready production state.',
                  expected,
                  actual,
                  deploymentId: deployment.id,
                  deploymentUrl: deployment.url,
                },
                null,
                2,
              ),
            );
            process.exit(1);
          }

          console.log(
            JSON.stringify(
              {
                message: 'Vercel production deployment is ready.',
                deploymentId: deployment.id,
                deploymentUrl: deployment.url,
                ...actual,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Verify hosted runtime
        run: pnpm vercel:runtime:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel_deploy.outputs.production_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Promote verified deployment to Production
        run: ./node_modules/.bin/vercel promote "${{ steps.vercel_deploy.outputs.production_url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify promoted Production runtime
        run: pnpm vercel:runtime:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.build_context.outputs.production_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
