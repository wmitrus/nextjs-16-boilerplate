name: Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Vercel Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pull Vercel Environment Information
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify Environment
        run: pnpm env:check
        env:
          APP_ENV: production

      - name: Validate Environment Cross-Field Requirements
        run: pnpm env:validate
        env:
          APP_ENV: production
          NODE_ENV: production

      - name: Validate Deployment Profiles
        run: pnpm vercel:deploy:validate

      - name: Build Project Artifacts
        id: build_context
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          set +a

          if [ "${AUTH_PROVIDER:-}" = "authjs" ] && [ -z "${NEXTAUTH_URL:-}" ]; then
            echo "AUTH_PROVIDER=authjs requires NEXTAUTH_URL in Vercel Production env. Do not mask a missing runtime env with a build-only fallback."
            exit 1
          fi

          if [ -z "${VERCEL_URL:-}" ]; then
            unset VERCEL_URL
          fi

          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA:0:16}-${GITHUB_RUN_ID}"
          echo "production_url=$NEXT_PUBLIC_APP_URL" >> "$GITHUB_OUTPUT"
          pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          APP_ENV: production
          NEXT_PUBLIC_APP_ENV: production

      - name: Validate Prebuilt Artifact Contract
        run: pnpm vercel:prebuilt:validate

      - name: Activate Production Prebuilt Upload Profile
        run: cp .vercelignore.prebuilt .vercelignore

      - name: Validate Prebuilt Upload Coverage
        shell: bash
        run: |
          pnpm exec vercel deploy --prebuilt --prod --dry --json --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-prebuilt-dry-run.json
          pnpm vercel:prebuilt:validate -- --dry-run-json /tmp/vercel-prebuilt-dry-run.json

      - name: Deploy to Vercel
        id: vercel_deploy
        shell: bash
        run: |
          DEPLOY_URL=$(pnpm exec vercel deploy --prebuilt --prod --skip-domain --token=${{ secrets.VERCEL_TOKEN }} \
            --meta githubDeployment=1 \
            --meta githubCommitOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubCommitRepo="$GITHUB_REPOSITORY_NAME" \
            --meta githubRepo="$GITHUB_REPOSITORY_NAME" \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA")
          if [ -z "$DEPLOY_URL" ]; then
            echo "Vercel deploy did not return a deployment URL."
            exit 1
          fi
          echo "production_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Verify Production Deployment Readiness
        shell: bash
        run: |
          pnpm exec vercel inspect "${{ steps.vercel_deploy.outputs.production_url }}" --wait --json --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-production-inspect.json
          node - <<'NODE'
          const fs = require('node:fs');

          const deployment = JSON.parse(
            fs.readFileSync('/tmp/vercel-production-inspect.json', 'utf8'),
          );
          const expected = {
            readyState: 'READY',
            target: 'production',
          };
          const actual = {
            readyState: deployment.readyState,
            target: deployment.target,
          };

          if (
            actual.readyState !== expected.readyState ||
            actual.target !== expected.target
          ) {
            console.error(
              JSON.stringify(
                {
                  message:
                    'Vercel deployment did not reach the expected ready production state.',
                  expected,
                  actual,
                  deploymentId: deployment.id,
                  deploymentUrl: deployment.url,
                },
                null,
                2,
              ),
            );
            process.exit(1);
          }

          console.log(
            JSON.stringify(
              {
                message: 'Vercel production deployment is ready.',
                deploymentId: deployment.id,
                deploymentUrl: deployment.url,
                ...actual,
              },
              null,
              2,
            ),
          );
          NODE

      - name: Verify hosted runtime
        run: pnpm vercel:runtime:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel_deploy.outputs.production_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Promote verified deployment to Production
        run: pnpm exec vercel promote "${{ steps.vercel_deploy.outputs.production_url }}" --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify promoted Production runtime
        run: pnpm vercel:runtime:smoke
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.build_context.outputs.production_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
