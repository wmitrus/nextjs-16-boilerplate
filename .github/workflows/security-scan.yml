name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 24

      # Dependency-audit policy (do not weaken):
      #   High/Critical in a RUNTIME dependency      -> blocks merge (step below)
      #   High/Critical in a DEVELOPMENT dependency   -> blocks merge (step below)
      #   Moderate across the full graph              -> visibility only
      #
      # A single full-graph `pnpm audit` sends the entire tree as one bulk
      # request to registry.npmjs.org/-/npm/v1/security/advisories/bulk; that
      # endpoint degrades on large bodies (~5k nodes full vs ~1.3k --prod /
      # ~3.8k --dev). Splitting the blocking gate into --prod and --dev reduces
      # each request's size while preserving High+ coverage for both the runtime
      # and the development graph. Both requests still hit the npm advisories
      # endpoint and may still retry or be slow (`pnpm audit` runs its own
      # retry/backoff for this endpoint -- NPM_CONFIG_FETCH_* does not control
      # it), so each blocking step carries a hard `timeout-minutes` bound: a
      # timeout is a FAILED step, never a silent pass. Advisories that are
      # genuinely dev-only AND production-unreachable are handled by explicit,
      # documented entries in pnpm-workspace.yaml `audit.ignore` -- never by
      # removing a gate.

      - name: Run pnpm audit (production deps, High+, blocking)
        timeout-minutes: 10
        run: pnpm audit --prod --audit-level high

      - name: Run pnpm audit (development deps, High+, blocking)
        timeout-minutes: 10
        run: pnpm audit --dev --audit-level high

      - name: Run pnpm audit (full graph, Moderate+, visibility only)
        # Non-blocking: widens severity to Moderate across the whole graph for
        # awareness in the CI log. High/Critical (prod AND dev) are already
        # blocking above -- this step only adds severity breadth, not a gate.
        continue-on-error: true
        timeout-minutes: 10
        run: pnpm audit --audit-level moderate

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Required for gitleaks to scan history

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
