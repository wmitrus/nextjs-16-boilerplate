name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Run pnpm audit (production deps, High+, blocking)
        # Blocking merge gate, scoped to production dependencies.
        # `pnpm audit` (full graph) sends the entire dependency tree as one
        # bulk request to registry.npmjs.org/-/npm/v1/security/advisories/bulk;
        # that endpoint degrades on large bodies and the dev graph is now big
        # enough that the request times out (`--prod` ~1.3k nodes vs ~5k full).
        # Prod deps are what ships, and every advisory currently ignored in
        # pnpm-workspace.yaml is already a dev-only, production-unreachable
        # build tool. Full-graph moderate+ stays below, non-blocking.
        run: pnpm audit --prod --audit-level high

      - name: Run pnpm audit (full graph, Moderate+, visibility only)
        # Non-blocking: surfaces dev+prod advisories in the CI log without
        # gating the build. Single attempt with a 60s cap so it fails fast
        # instead of burning CI minutes on retries when the bulk endpoint
        # times out on the large body.
        continue-on-error: true
        env:
          NPM_CONFIG_FETCH_RETRIES: '0'
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
        run: pnpm audit --audit-level moderate

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Required for gitleaks to scan history

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
