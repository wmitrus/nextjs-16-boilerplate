deprecated: true
reason: >-
  This historical sample is not an executable workflow and must not be copied
  into GitHub Actions. It used a locally built prebuilt Preview deployment,
  which is incompatible with the Neon Preview Branching model.
operationalWorkflow: ../../.github/workflows/preview-deploy.yml
operationalContract:
  trigger: pull requests to main
  build: Vercel remote Preview source build
  prohibitedCommands:
    - vercel build
    - vercel deploy --prebuilt
  requiredMetadata:
    - pull request branch
    - pull request SHA
  verification: deployment Git metadata before downstream validation
reference: ../features/DEPLOY-neon.md
