audit:
  # --- GHSA-jmr9-qjv8-65gv (extract-zip@2.0.1, symlink path traversal) ---
  # Reason: upstream-blocked -- the GitHub advisory records
  # `Patched versions: none` (re-verified 2026-10-27; `npm view extract-zip
  # versions` still tops out at 2.0.1). Surfaced by pinning @lhci/cli (A.8 SEC-32 follow-up,
  # 2026-08-22) as a real devDependency instead of fetching it via `npx`
  # -- pinning didn't introduce the vulnerability, it just made pnpm audit
  # see a transitive dependency that was always being fetched unaudited
  # before. Re-check periodically; bump the moment a fixed version
  # publishes.
  # Dependency path (confirmed via `pnpm why extract-zip`, 2026-08-22):
  #   extract-zip@2.0.1
  #   └─ @puppeteer/browsers@2.13.2
  #      └─ puppeteer-core@24.43.1
  #         └─ lighthouse@12.6.1
  #            └─ @lhci/cli@0.15.1 (devDependencies)
  # Dev-only proof: reached exclusively through @lhci/cli, a
  # devDependency invoked only in the `preview-deploy.yml` Lighthouse CI
  # job -- never in the production Next.js bundle or a deployed server.
  # Additionally not reachable *in practice* even within that job: the
  # vulnerable code path is inside @puppeteer/browsers' zip-extraction
  # step for a Chromium binary IT downloads -- this repo's own
  # `preview-deploy.yml` never lets puppeteer/lighthouse download or
  # extract a browser at all; it launches its own pre-installed Chromium
  # (via Playwright, already vetted) and points lighthouse at it over CDP
  # (`--collect.settings.port=9222`), so extract-zip's actual extraction
  # logic is dead code on this repo's own execution path, not just an
  # unreachable production surface.
  # Owner: repository maintainers (wmitrus) -- re-review on every
  # quarterly dependency-audit pass, not just when this comment is read.
  # Review expiry: 2027-01-27 (quarterly) -- if still unresolved upstream
  # at that date, re-confirm both the dev-only and the
  # dead-code-on-this-repo's-CDP-path proofs still hold before
  # re-extending the ignore. Both proofs re-confirmed 2026-10-27
  # (`preview-deploy.yml` still launches Playwright's Chromium with
  # --remote-debugging-port=9222 and runs lhci with
  # --collect.settings.port=9222).
  #
  # --- GHSA-7pqw-9j4j-h8q3 (extract-zip@2.0.1, arbitrary file write via
  #     symlink archive entries) ---
  # Reason: a sibling advisory to GHSA-jmr9-qjv8-65gv above -- same package,
  # same pinned version (extract-zip@2.0.1), same symlink-archive-entry root
  # cause, same dependency path (@lhci/cli > lighthouse > puppeteer-core >
  # @puppeteer/browsers > extract-zip). GitHub advisory (published
  # 2026-08-17) records `Patched versions: none` -- no fixed extract-zip
  # release exists, so there is nothing to bump to. Confirmed dev-only and
  # dead code on this repo's own Lighthouse-CI path by the identical proof
  # documented for GHSA-jmr9-qjv8-65gv (verified 2026-09-09): the
  # `preview-deploy.yml` Lighthouse job never lets puppeteer download or
  # unzip a browser, it drives a pre-installed Chromium over CDP.
  # Owner: repository maintainers (wmitrus).
  # Review expiry: 2027-01-27 (quarterly) -- drop the moment a fixed
  # extract-zip publishes; otherwise re-confirm the shared proof
  # (re-confirmed 2026-10-27).
  # --- GHSA-mrhx-c7xc-m3w5 (zod 3.x, memory exhaustion on oversized
  #     constrained collections) ---
  # Reason: the advisory covers zod <4.6.6 and no 3.x release carries a fix
  # (3.25.76 is the last 3.x). Every zod 4.x in the graph -- including the
  # production copy used by src/core/env.ts and input validation -- is forced
  # to >=4.6.6 by the `zod@>=4.0.0 <4.6.6` override above, so this ignore
  # only lets the remaining 3.x copies through. Forcing them to 4.x would
  # break their consumers (zod 3 -> 4 is a breaking API change).
  # Dependency paths (confirmed via `pnpm why zod`, 2026-10-27):
  #   zod@3.22.4  <- @vercel/backends / @vercel/hono / @vercel/express /
  #                  @vercel/python-analysis <- vercel (devDependencies)
  #   zod@3.25.76 <- chromium-bidi <- puppeteer-core <- lighthouse
  #                  <- @lhci/cli (devDependencies)
  # Dev-only proof: both roots are devDependencies (the Vercel CLI and the
  # Lighthouse CI runner); neither is bundled into the Next.js app. Bumping
  # does not help: vercel@65.4.0 (latest) still pins zod 3.22.4 and
  # @lhci/cli@0.15.1 is the latest release.
  # Caveat: pnpm ignores apply per GHSA, not per path -- the zod 4.x override
  # is what keeps production covered; never remove it while this ignore stays.
  # Owner: repository maintainers (wmitrus). Remove when vercel and
  # puppeteer-core move to zod >=4.6.6.
  # Review expiry: 2027-01-27 (quarterly).
  #
  ignore:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-mrhx-c7xc-m3w5

